<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dex - Project Name Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .background {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #f8fafc 0%, #f1f5f9 100%);
        }
        
        .webapp-mockup {
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            color: #1e3a5f;
            font-family: system-ui, sans-serif;
        }
        
        .logo-icon { width: 40px; height: 40px; }
        
        .header-icons {
            display: flex;
            gap: 20px;
            color: #64748b;
        }
        
        .main-content {
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
        }
        
        .main-content h1 {
            font-family: Georgia, serif;
            font-size: 42px;
            font-weight: normal;
            color: #1e3a5f;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #64748b;
            font-family: system-ui, sans-serif;
            margin-bottom: 40px;
        }
        
        .selected-advisor {
            background: white;
            border: 1px solid #7dd3e8;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .advisor-icon {
            width: 40px;
            height: 40px;
            background: #fff4e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f59e0b;
            font-size: 20px;
        }
        
        .advisor-info h3 {
            font-family: system-ui, sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 2px;
        }
        
        .advisor-info p {
            font-family: system-ui, sans-serif;
            font-size: 13px;
            color: #94a3b8;
        }
        
        .form-group {
            text-align: left;
            margin-bottom: 30px;
        }
        
        .form-group label {
            display: block;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .input-field {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #7dd3e8;
            border-radius: 8px;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            color: #1e3a5f;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field.typing {
            border-color: #1e3a5f;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn-back {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #64748b;
            font-family: system-ui, sans-serif;
            font-size: 15px;
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .btn-create {
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-family: system-ui, sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-create.pressed {
            background: #2d5a8f;
            transform: scale(0.98);
        }
        
        /* DEX */
        .stick-figure {
            position: fixed;
            width: 100px;
            height: 280px;
            z-index: 1000;
        }
        
        /* Replay button */
        .replay-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            z-index: 1001;
        }
        
        .replay-btn:hover {
            background: #2d5a8f;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="webapp-mockup">
            <div class="header">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#7dd3e8" stroke-width="2"/>
                        <circle cx="20" cy="20" r="12" fill="none" stroke="#1e3a5f" stroke-width="2"/>
                        <circle cx="20" cy="20" r="4" fill="#1e3a5f"/>
                        <line x1="20" y1="2" x2="20" y2="8" stroke="#7dd3e8" stroke-width="2"/>
                        <line x1="20" y1="32" x2="20" y2="38" stroke="#7dd3e8" stroke-width="2"/>
                        <line x1="2" y1="20" x2="8" y2="20" stroke="#7dd3e8" stroke-width="2"/>
                        <line x1="32" y1="20" x2="38" y2="20" stroke="#7dd3e8" stroke-width="2"/>
                    </svg>
                    omgever
                </div>
                <div class="header-icons">
                    <span>⚙️</span>
                    <span>✉️</span>
                    <span>👤</span>
                </div>
            </div>
            
            <div class="main-content">
                <h1>Geef je project een naam</h1>
                <p class="subtitle">Kies een herkenbare naam voor je project</p>
                
                <div class="selected-advisor">
                    <div class="advisor-icon">🌱</div>
                    <div class="advisor-info">
                        <h3>Adviseur stikstof onderzoeken - eenvoudig</h3>
                        <p>Deze adviseur dient voor het analyseren van eenvoudig...</p>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Projectnaam</label>
                    <input type="text" class="input-field" id="projectInput" value="" placeholder="">
                </div>
                
                <div class="buttons">
                    <button class="btn-back">← Terug</button>
                    <button class="btn-create" id="createBtn">Project aanmaken</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- DEX -->
    <svg class="stick-figure" id="dex" viewBox="0 0 100 280">
        <!-- Hair tuft -->
        <path d="M 48 5 Q 52 -2 56 5 Q 60 0 60 8" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Head -->
        <circle cx="50" cy="35" r="25" fill="none" stroke="#1e3a5f" stroke-width="3.5"/>
        
        <!-- Open eyes -->
        <ellipse cx="42" cy="32" rx="3" ry="7" fill="#1e3a5f"/>
        <ellipse cx="58" cy="32" rx="3" ry="7" fill="#1e3a5f"/>
        
        <!-- Rosy cheeks -->
        <circle cx="32" cy="40" r="4" fill="#f8d7da" opacity="0.6"/>
        <circle cx="68" cy="40" r="4" fill="#f8d7da" opacity="0.6"/>
        
        <!-- Small cute smile -->
        <path d="M 44 47 Q 50 52 56 47" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Neck -->
        <line x1="50" y1="60" x2="50" y2="70" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Body -->
        <line x1="50" y1="70" x2="50" y2="160" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Left arm (animated) -->
        <path id="leftArm" d="M 50 78 Q 20 93 15 153" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Right arm (animated) -->
        <path id="rightArm" d="M 50 78 Q 80 93 85 153" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Left leg -->
        <path d="M 50 160 Q 40 210 30 265" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Right leg -->
        <path d="M 50 160 Q 60 210 70 265" fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
    </svg>
    
    <button class="replay-btn" onclick="replayAnimation()">Replay</button>
    
    <script>
        const dex = document.getElementById('dex');
        const leftArm = document.getElementById('leftArm');
        const rightArm = document.getElementById('rightArm');
        const projectInput = document.getElementById('projectInput');
        const createBtn = document.getElementById('createBtn');
        
        // Text to type
        const textToType = "Advies stikstofonderzoek nieuw";
        
        // Starting position (bottom left)
        const startX = 30;
        const startY = window.innerHeight - 300;
        
        // End position: left of the input field
        let endX, endY;
        
        function calculatePositions() {
            const inputRect = projectInput.getBoundingClientRect();
            endX = inputRect.left - 110;
            endY = inputRect.top - 80;
        }
        
        // Arm positions
        const armDownLeft = "M 50 78 Q 20 93 15 153";
        const armDownRight = "M 50 78 Q 80 93 85 153";
        
        // Typing positions - arms forward, alternating
        const armTypingLeftUp = "M 50 78 Q 55 70 75 65";
        const armTypingLeftDown = "M 50 78 Q 60 75 80 75";
        const armTypingRightUp = "M 50 78 Q 55 70 75 65";
        const armTypingRightDown = "M 50 78 Q 60 75 80 75";
        
        // Pointing at button
        const armPointRight = "M 50 78 Q 75 55 95 50";
        
        let animationId;
        let startTime;
        let phase = 'moving';
        let charIndex = 0;
        let lastTypeTime = 0;
        
        const moveDuration = 1500;
        const typeDelay = 80; // ms per character
        const raiseDuration = 500;
        const pressDuration = 300;
        
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }
        
        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }
        
        function interpolatePath(pathA, pathB, t) {
            const parseQ = (path) => {
                const match = path.match(/M\s*([\d.-]+)\s+([\d.-]+)\s+Q\s*([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)\s+([\d.-]+)/);
                return {
                    mx: parseFloat(match[1]),
                    my: parseFloat(match[2]),
                    cx: parseFloat(match[3]),
                    cy: parseFloat(match[4]),
                    ex: parseFloat(match[5]),
                    ey: parseFloat(match[6])
                };
            };
            
            const a = parseQ(pathA);
            const b = parseQ(pathB);
            
            return `M ${lerp(a.mx, b.mx, t)} ${lerp(a.my, b.my, t)} Q ${lerp(a.cx, b.cx, t)} ${lerp(a.cy, b.cy, t)} ${lerp(a.ex, b.ex, t)} ${lerp(a.ey, b.ey, t)}`;
        }
        
        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            
            if (phase === 'moving') {
                const t = Math.min(elapsed / moveDuration, 1);
                const eased = easeInOut(t);
                
                const currentX = lerp(startX, endX, eased);
                const currentY = lerp(startY, endY, eased);
                
                dex.style.left = currentX + 'px';
                dex.style.top = currentY + 'px';
                
                if (t >= 1) {
                    phase = 'prepare-typing';
                    startTime = timestamp;
                }
            }
            else if (phase === 'prepare-typing') {
                // Raise arms to typing position
                const t = Math.min(elapsed / 400, 1);
                const eased = easeInOut(t);
                
                leftArm.setAttribute('d', interpolatePath(armDownLeft, armTypingLeftDown, eased));
                rightArm.setAttribute('d', interpolatePath(armDownRight, armTypingRightUp, eased));
                
                if (t >= 1) {
                    phase = 'typing';
                    startTime = timestamp;
                    lastTypeTime = timestamp;
                    projectInput.classList.add('typing');
                }
            }
            else if (phase === 'typing') {
                // Type characters and alternate arms
                if (timestamp - lastTypeTime > typeDelay && charIndex < textToType.length) {
                    charIndex++;
                    projectInput.value = textToType.substring(0, charIndex);
                    lastTypeTime = timestamp;
                    
                    // Alternate arms
                    if (charIndex % 2 === 0) {
                        leftArm.setAttribute('d', armTypingLeftDown);
                        rightArm.setAttribute('d', armTypingRightUp);
                    } else {
                        leftArm.setAttribute('d', armTypingLeftUp);
                        rightArm.setAttribute('d', armTypingRightDown);
                    }
                }
                
                if (charIndex >= textToType.length) {
                    phase = 'finish-typing';
                    startTime = timestamp;
                    projectInput.classList.remove('typing');
                }
            }
            else if (phase === 'finish-typing') {
                // Brief pause, then move to button
                if (elapsed > 500) {
                    phase = 'move-to-button';
                    startTime = timestamp;
                    
                    // Calculate button position
                    const btnRect = createBtn.getBoundingClientRect();
                    endX = btnRect.left - 110;
                    endY = btnRect.top - 80;
                }
            }
            else if (phase === 'move-to-button') {
                const currentLeft = parseFloat(dex.style.left);
                const currentTop = parseFloat(dex.style.top);
                
                const t = Math.min(elapsed / 800, 1);
                const eased = easeInOut(t);
                
                // Move smoothly to button
                const inputRect = projectInput.getBoundingClientRect();
                const fromX = inputRect.left - 110;
                const fromY = inputRect.top - 80;
                
                dex.style.left = lerp(fromX, endX, eased) + 'px';
                dex.style.top = lerp(fromY, endY, eased) + 'px';
                
                // Lower arms during move
                leftArm.setAttribute('d', interpolatePath(armTypingLeftDown, armDownLeft, eased));
                rightArm.setAttribute('d', interpolatePath(armTypingRightUp, armDownRight, eased));
                
                if (t >= 1) {
                    phase = 'raising';
                    startTime = timestamp;
                }
            }
            else if (phase === 'raising') {
                const t = Math.min(elapsed / raiseDuration, 1);
                const eased = easeInOut(t);
                
                rightArm.setAttribute('d', interpolatePath(armDownRight, armPointRight, eased));
                
                if (t >= 1) {
                    phase = 'pressing';
                    startTime = timestamp;
                    createBtn.classList.add('pressed');
                }
            }
            else if (phase === 'pressing') {
                const t = Math.min(elapsed / pressDuration, 1);
                
                if (t >= 1) {
                    phase = 'done';
                    return;
                }
            }
            
            if (phase !== 'done') {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        function startAnimation() {
            calculatePositions();
            
            phase = 'moving';
            startTime = null;
            charIndex = 0;
            projectInput.value = '';
            projectInput.classList.remove('typing');
            createBtn.classList.remove('pressed');
            
            dex.style.left = startX + 'px';
            dex.style.top = startY + 'px';
            leftArm.setAttribute('d', armDownLeft);
            rightArm.setAttribute('d', armDownRight);
            
            animationId = requestAnimationFrame(animate);
        }
        
        function replayAnimation() {
            if (animationId) cancelAnimationFrame(animationId);
            startAnimation();
        }
        
        window.addEventListener('load', () => {
            setTimeout(startAnimation, 500);
        });
        
        window.addEventListener('resize', calculatePositions);
    </script>
</body>
</html>
